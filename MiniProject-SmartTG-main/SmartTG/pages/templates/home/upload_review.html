{% extends 'Navbar/nav.html' %}
{% block content %}
<div class="container py-5" style="max-width: 700px;">
  <div class="card shadow-lg p-4 rounded-4">
    <h3 class="text-center text-primary mb-4">✍️ Write a Review for {{ place.name }}</h3>

    <form method="POST">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label fw-semibold">Rating</label>
        {{ form.rating }}
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Your Review</label>
        {{ form.comment }}
      </div>
      <div class="text-center">
        <button type="submit" class="btn btn-success px-4">Submit Review</button>
        <a href="{% url 'place_detail' place.id %}" class="btn btn-outline-secondary ms-2">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
