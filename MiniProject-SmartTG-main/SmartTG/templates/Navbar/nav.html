{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}My Tourist{% endblock %}</title>

  
  <!-- Bootstrap + Font Awesome -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{% static 'css/style01.css' %}">
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar-custom">
    <div class="logo">
      <i class="fa-solid fa-plane-departure"></i> My Tourist
    </div>

    <div class="nav-links">
      <a href="{% url 'home' %}"><i class="fa-solid fa-house"></i> Home</a>
      
      <a href="{% url 'wishlist' %}"><i class="fa-solid fa-heart"></i> Wishlist</a> 
      
      <a href="{% url 'contact' %}"><i class="fa-solid fa-envelope"></i> Contact</a>
      <a href="{% url 'user_profile' %}"><i class="fa-solid fa-earth-asia"></i>User</a>
      <a href="{% url 'about' %}"><i class="fa-solid fa-circle-info"></i> About</a>

      {% if user.is_authenticated %}
        <a href="{% url 'logout' %}"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
      {% else %}
        <a href="{% url 'login' %}"><i class="fa-solid fa-right-to-bracket"></i> Login</a>
        <a href="{% url 'register' %}"><i class="fa-solid fa-user-plus"></i> Register</a>
      {% endif %}

      <!-- 🔍 Search Section -->
      <div class="search-container">
  <button type="button" class="btn btn-success btn-sm" id="searchToggle">
    <i class="fa-solid fa-magnifying-glass"></i>
  </button>

  <form action="{% url 'search_places' %}" method="get" class="search-form">
    <input type="text" name="q" id="searchInput" class="form-control form-control-sm"
           placeholder="Search places...">
  </form>
</div>


    </div>
  </nav>

  <!-- Page-Specific Content -->
  <main>
    {% block content %}
    {% endblock %}
  </main>

  <!-- Footer -->
  <footer class="text-center py-3" 
        style="background-color: rgba(255, 255, 255, 0.8); border-top: 1px solid #a5d6a7;">
    <p class="mb-0 fw-semibold" style="color: #1b5e20;">
      © 2025 My Tourist | Designed for Travel Lovers ✈️
    </p>
  </footer>





</body>
</html>
