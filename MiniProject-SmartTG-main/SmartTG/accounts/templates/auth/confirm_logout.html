{% extends "layouts/app.html" %}

{% block title %}Confirm Logout | My Tourist{% endblock %}

{% block content %}
<div class="d-flex flex-column align-items-center justify-content-center" style="min-height: 80vh;">
  
  <div class="card shadow p-4 text-center" style="border-radius: 20px; max-width: 400px; width: 90%; background-color: #ffffff;">
    <div class="mb-3">
      <i class="fa-solid fa-circle-question fa-3x" style="color: #1E90FF;"></i>
    </div>

    <h3 class="mb-2" style="color: #333;">Are you sure you want to logout?</h3>
    <p class="text-muted mb-4">You’ll be redirected to the login page after logging out.</p>

    <form method="POST" action="{% url 'logout' %}">
      {% csrf_token %}
      <div class="d-flex justify-content-center gap-3">
        <button type="submit" class="btn btn-danger px-4">
          <i class="fa-solid fa-right-from-bracket"></i> Logout
        </button>
        <a href="{% url 'home' %}" class="btn btn-secondary px-4">
          <i class="fa-solid fa-xmark"></i> Cancel
        </a>
      </div>
    </form>
  </div>

</div>
{% endblock %}
